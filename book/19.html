<h2>Chapter 19 — The Car</h2>
<p>We made it to the car.</p>
<p>I locked the doors.</p>
<p>I told them everything calmly.</p>
<p>That they were safe.</p>
<p>That they were in good hands.</p>
<p>I didn’t tell anyone I didn’t have a band.</p>
<p>Not your parents.</p>
<p>Not you.</p>
<p>You held my hand.</p>
