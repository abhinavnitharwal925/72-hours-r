<h2>Chapter 18 — Collapse</h2>
<p>Gunfire cracked through everything.</p>
<p>People dropped. Ran. Grabbed.</p>
<p>Hands tore at wrists.</p>
<p>I moved with one arm working and one arm broken.</p>
<p>Your mom grabbed me.</p>
<p>“kana,” she said, “it’s a relief to see you.”</p>
<p>I nodded.</p>
<p>I couldn’t afford to speak.</p>
