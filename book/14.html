<h2>Chapter 14 — Movement</h2>
<p>My car was gone.</p>
<p>A sedan nearby was unlocked.</p>
<p>I started it without the key.</p>
<p>I drove back roads.</p>
<p>One thought stayed steady.</p>
<p>Get to you.</p>
<p>See if you’re there.</p>
<p>Then move.</p>
