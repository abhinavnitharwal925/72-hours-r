<h2>Chapter 16 — Pressure</h2>
<p>The stadium felt tight.</p>
<p>People weren’t panicking.</p>
<p>They were watching.</p>
<p>My arm was broken. My wrist was slit open again.</p>
<p>I saw families torn apart because they miscounted.</p>
<p>Because someone didn’t have space.</p>
